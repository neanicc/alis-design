<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Playback controls</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ---------- Tokens ---------- */
  :root {
    --ground: oklch(98% 0.004 85);
    --surface: #fffdfb;
    --ink: oklch(19% 0.008 80);
    --text-2: oklch(50% 0.01 80);
    --text-3: oklch(68% 0.01 80);
    --hairline: color-mix(in oklab, var(--ink) 12%, transparent);
    --hairline-soft: color-mix(in oklab, var(--ink) 8%, transparent);
    --tint-6: color-mix(in oklab, var(--ink) 6%, var(--surface));
    --tint-hover: color-mix(in oklab, var(--ink) 5%, var(--surface));
    --accent: #b44b3d; /* editorial red — warm family, focus rings only */
    --thumb: #ffffff;
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
    --shadow-float: 0 1px 2px color-mix(in oklab, var(--ink) 10%, transparent),
                    0 8px 28px color-mix(in oklab, var(--ink) 8%, transparent);
  }

  @media (prefers-contrast: more) {
    :root {
      --hairline: color-mix(in oklab, var(--ink) 26%, transparent);
      --hairline-soft: color-mix(in oklab, var(--ink) 20%, transparent);
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--ground);
    color: var(--ink);
    font-family: "Geist", -apple-system, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px 16px;
  }

  /* ---------- Card ---------- */
  .card {
    background: var(--surface);
    border: 1px solid var(--hairline-soft);
    border-radius: 16px;
    width: 100%;
    max-width: 440px;
    transition: opacity 400ms var(--ease), translate 400ms var(--ease);
  }
  @starting-style {
    .card { opacity: 0; translate: 0 8px; }
  }

  .card-head { padding: 20px 22px 16px; }
  .card-head h1 {
    font-size: 16px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .card-head p { color: var(--text-3); font-size: 13px; margin-top: 2px; }

  .section {
    padding: 16px 22px 18px;
    border-top: 1px solid var(--hairline-soft);
  }
  .section-label {
    font-size: 12px;
    font-weight: 500;
    color: var(--text-2);
    margin-bottom: 8px; /* legend → first item ≈ 8px */
  }

  /* ---------- Icon buttons + tooltips ---------- */
  .icon-row { display: flex; gap: 10px; }

  .icon-btn {
    position: relative;
    width: 38px;
    height: 38px;
    display: grid;
    place-items: center;
    background: var(--surface);
    color: var(--ink);
    border: 1px solid var(--hairline);
    border-radius: 12px;
    cursor: pointer;
    transition: background-color 140ms var(--ease),
                border-color 140ms var(--ease),
                transform 140ms var(--ease);
  }
  .icon-btn:hover { background: var(--tint-hover); z-index: 2; }
  .icon-btn:active { transform: scale(0.97); }
  .icon-btn svg { width: 16px; height: 16px; display: block; }
  .icon-btn .nudge { translate: 1px 0; } /* optical center for the play glyph */

  :is(.icon-btn, .switch input, .seg input, .slider-wrap input):focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  /* Custom tooltip: ink bubble, paper text, above the trigger */
  .tooltip {
    position: absolute;
    bottom: calc(100% + 6px);
    left: 50%;
    translate: -50% 0;
    transform: scale(0.97);
    transform-origin: bottom center;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    background: var(--ink);
    color: var(--surface);
    font-size: 11px;
    font-weight: 500;
    line-height: 1;
    padding: 6px 8px;
    border-radius: 7px;
    white-space: nowrap;
    box-shadow: var(--shadow-float);
    transition: opacity 140ms var(--ease),
                transform 140ms var(--ease),
                visibility 140ms;
    z-index: 3;
  }
  .tooltip.align-start { left: 0; translate: 0 0; transform-origin: bottom left; }
  .tooltip.align-end { left: auto; right: 0; translate: 0 0; transform-origin: bottom right; }

  /* Hover reveal: 500ms intent delay, pointer-fine only */
  @media (hover: hover) and (pointer: fine) {
    .icon-btn:hover .tooltip {
      opacity: 1;
      visibility: visible;
      transform: scale(1);
      transition-delay: 500ms;
    }
    /* Once one tooltip is open, neighbours open with no delay and no animation */
    .icon-btn.tt-warm:hover .tooltip {
      transition-delay: 0ms;
      transition-duration: 0ms;
    }
  }
  /* Keyboard: instant on focus-visible */
  .icon-btn:focus-visible .tooltip {
    opacity: 1;
    visibility: visible;
    transform: scale(1);
    transition-delay: 0ms;
  }
  /* Forced open for the static screenshot */
  .tooltip.is-open {
    opacity: 1;
    visibility: visible;
    transform: scale(1);
    transition-delay: 0ms;
  }

  /* ---------- Volume slider ---------- */
  .slider-wrap { position: relative; padding-top: 34px; }

  .slider-wrap input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 18px;
    background: transparent;
    cursor: grab;
    --fill: 64%;
  }
  .slider-wrap input[type="range"]:active { cursor: grabbing; }

  .slider-wrap input[type="range"]::-webkit-slider-runnable-track {
    height: 5px;
    border-radius: 999px;
    background: linear-gradient(to right,
      var(--ink) 0 var(--fill),
      color-mix(in oklab, var(--ink) 10%, transparent) var(--fill));
  }
  .slider-wrap input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 18px;
    height: 18px;
    margin-top: -6.5px;
    border-radius: 999px;
    background: var(--thumb);
    border: 1px solid var(--hairline);
    box-shadow: 0 1px 2px color-mix(in oklab, var(--ink) 14%, transparent);
    transition: transform 140ms var(--ease);
  }
  .slider-wrap input[type="range"]:active::-webkit-slider-thumb { transform: scale(0.97); }

  .slider-wrap input[type="range"]::-moz-range-track {
    height: 5px;
    border-radius: 999px;
    background: color-mix(in oklab, var(--ink) 10%, transparent);
  }
  .slider-wrap input[type="range"]::-moz-range-progress {
    height: 5px;
    border-radius: 999px;
    background: var(--ink);
  }
  .slider-wrap input[type="range"]::-moz-range-thumb {
    width: 16px;
    height: 16px;
    border-radius: 999px;
    background: var(--thumb);
    border: 1px solid var(--hairline);
    box-shadow: 0 1px 2px color-mix(in oklab, var(--ink) 14%, transparent);
    transition: transform 140ms var(--ease);
  }
  .slider-wrap input[type="range"]:active::-moz-range-thumb { transform: scale(0.97); }

  /* Value bubble: same recipe as the tooltip, tracks the thumb 1:1 */
  .value-bubble {
    position: absolute;
    top: 0;
    left: 64%; /* JS keeps this on the thumb centre */
    translate: -50% 0;
    transform: scale(0.97);
    transform-origin: bottom center;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    background: var(--ink);
    color: var(--surface);
    font-size: 11px;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    line-height: 1;
    padding: 6px 8px;
    border-radius: 7px;
    box-shadow: var(--shadow-float);
    transition: opacity 140ms var(--ease), transform 140ms var(--ease), visibility 140ms;
  }
  .value-bubble.is-open,
  .slider-wrap:has(input:active) .value-bubble,
  .slider-wrap:has(input:focus-visible) .value-bubble {
    opacity: 1;
    visibility: visible;
    transform: scale(1);
  }

  /* ---------- Switch + segmented control ---------- */
  .prefs-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px 16px;
  }

  .switch {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
  }
  .switch-label { font-size: 14px; color: var(--ink); }
  .switch input {
    -webkit-appearance: none;
    appearance: none;
    width: 40px;
    height: 24px;
    border-radius: 999px;
    background: color-mix(in oklab, var(--ink) 12%, var(--surface));
    border: 1px solid var(--hairline-soft);
    position: relative;
    cursor: pointer;
    transition: background-color 180ms var(--ease), border-color 180ms var(--ease);
  }
  .switch input::after {
    content: "";
    position: absolute;
    top: 2px;
    left: 2px;
    width: 18px;
    height: 18px;
    border-radius: 999px;
    background: var(--thumb);
    box-shadow: 0 1px 2px color-mix(in oklab, var(--ink) 16%, transparent);
    transition: translate 180ms var(--ease);
  }
  .switch input:checked { background: var(--ink); border-color: var(--ink); }
  .switch input:checked::after { translate: 16px 0; }
  .switch input:active::after { scale: 0.97; }

  .seg {
    position: relative;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    background: var(--tint-6);
    border: 1px solid var(--hairline-soft);
    border-radius: 12px;
    padding: 3px;
  }
  .seg-ind {
    position: absolute;
    top: 3px;
    left: 3px;
    width: calc((100% - 6px) / 3);
    height: calc(100% - 6px);
    background: var(--surface);
    border: 1px solid var(--hairline);
    border-radius: 9px;
    transition: transform 180ms var(--ease);
  }
  .seg:has(input:nth-of-type(2):checked) .seg-ind { transform: translateX(100%); }
  .seg:has(input:nth-of-type(3):checked) .seg-ind { transform: translateX(200%); }
  .seg input {
    position: absolute;
    width: 1px;
    height: 1px;
    opacity: 0;
    pointer-events: none;
  }
  .seg label {
    position: relative;
    z-index: 1;
    text-align: center;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-2);
    padding: 5px 14px;
    border-radius: 9px;
    cursor: pointer;
    transition: color 140ms var(--ease), transform 140ms var(--ease);
  }
  .seg label:active { transform: scale(0.97); }
  .seg input:checked + label { color: var(--ink); }
  .seg input:focus-visible + label {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  /* ---------- Reduced motion: state changes stay, travel goes ---------- */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      transition-duration: 0.01ms !important;
      animation-duration: 0.01ms !important;
    }
    /* hover-intent delay is anti-flicker, not motion — keep it */
  }
</style>
</head>
<body>

<main class="card">
  <header class="card-head">
    <h1>Playback &amp; controls</h1>
    <p>Floating layers demo</p>
  </header>

  <section class="section">
    <h2 class="section-label">Playback</h2>
    <div class="icon-row" id="icon-row">
      <button class="icon-btn" type="button" aria-label="Previous track">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3.5 3v10" /><path d="M12.5 3.5 6 8l6.5 4.5V3.5Z" />
        </svg>
        <span class="tooltip" aria-hidden="true">Previous track</span>
      </button>
      <button class="icon-btn" type="button" aria-label="Play">
        <svg class="nudge" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 2.8v10.4L13 8 4 2.8Z" />
        </svg>
        <span class="tooltip is-open" aria-hidden="true">Play</span>
      </button>
      <button class="icon-btn" type="button" aria-label="Next track">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12.5 3v10" /><path d="M3.5 3.5 10 8l-6.5 4.5V3.5Z" />
        </svg>
        <span class="tooltip" aria-hidden="true">Next track</span>
      </button>
    </div>
  </section>

  <section class="section">
    <h2 class="section-label">Volume</h2>
    <div class="slider-wrap">
      <span class="value-bubble is-open" id="vol-bubble" aria-hidden="true">64</span>
      <input type="range" id="vol" min="0" max="100" step="1" value="64" aria-label="Volume">
    </div>
  </section>

  <section class="section">
    <h2 class="section-label">Preferences</h2>
    <div class="prefs-row">
      <label class="switch">
        <span class="switch-label">Autoplay</span>
        <input type="checkbox" role="switch" checked>
      </label>
      <fieldset class="seg" style="border:0;padding:3px" aria-label="Range">
        <span class="seg-ind" aria-hidden="true"></span>
        <input type="radio" name="range" id="seg-day">
        <label for="seg-day">Day</label>
        <input type="radio" name="range" id="seg-week" checked>
        <label for="seg-week">Week</label>
        <input type="radio" name="range" id="seg-month">
        <label for="seg-month">Month</label>
      </fieldset>
    </div>
  </section>
</main>

<script>
  // Slider: fill + value bubble track the thumb 1:1
  (function () {
    var range = document.getElementById("vol");
    var bubble = document.getElementById("vol-bubble");
    var THUMB = 18;
    function sync() {
      var min = +range.min, max = +range.max, v = +range.value;
      var pct = (v - min) / (max - min);
      var x = pct * (range.clientWidth - THUMB) + THUMB / 2;
      bubble.style.left = x + "px";
      bubble.textContent = v;
      range.style.setProperty("--fill", (pct * 100) + "%");
    }
    range.addEventListener("input", sync);
    window.addEventListener("resize", sync);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(sync);
    sync();
  })();

  // Tooltip warm group: once one tooltip has opened, neighbours skip the
  // 500ms intent delay (and their animation) until the pointer leaves the row.
  (function () {
    var warm = false, warmTimer = null, coolTimer = null;
    var btns = document.querySelectorAll("#icon-row .icon-btn");
    btns.forEach(function (btn) {
      btn.addEventListener("mouseenter", function () {
        clearTimeout(coolTimer);
        if (warm) btn.classList.add("tt-warm");
        warmTimer = setTimeout(function () { warm = true; }, 500);
      });
      btn.addEventListener("mouseleave", function () {
        clearTimeout(warmTimer);
        btn.classList.remove("tt-warm");
        coolTimer = setTimeout(function () { warm = false; }, 300);
      });
    });
  })();
</script>

</body>
</html>
