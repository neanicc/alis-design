<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brew timer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ---- Tokens: every color lives here once; states derive via color-mix ---- */
  :root {
    --ground: oklch(98% 0.004 85);
    --surface: #fffdfb;
    --ink: oklch(19% 0.008 80);
    --accent: #b44b3d;

    --text-2: color-mix(in oklab, var(--ink) 62%, var(--ground));
    --text-3: color-mix(in oklab, var(--ink) 45%, var(--ground));
    --hairline: color-mix(in oklab, var(--ink) 12%, transparent);
    --hairline-soft: color-mix(in oklab, var(--ink) 8%, transparent);
    --tint: color-mix(in oklab, var(--ink) 6%, var(--surface));
    --tint-hover: color-mix(in oklab, var(--ink) 9%, var(--surface));
    --shadow-soft: 0 1px 2px color-mix(in oklab, var(--ink) 8%, transparent),
                   0 8px 24px color-mix(in oklab, var(--ink) 6%, transparent);
    --shadow-tip: 0 2px 8px color-mix(in oklab, var(--ink) 14%, transparent);

    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--ground);
    color: var(--ink);
    font-family: "Geist", -apple-system, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
    font-size: 14px;
    line-height: 1.45;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 32px 16px;
  }

  /* ---- Card ---- */
  .card {
    width: min(100%, 360px);
    background: var(--surface);
    border: 1px solid var(--hairline);
    border-radius: 16px;
    padding: 24px;
    box-shadow: var(--shadow-soft);
    transition: opacity 450ms var(--ease-out), translate 450ms var(--ease-out);
    @starting-style { opacity: 0; translate: 0 8px; }
  }

  .card-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 22px;
  }
  .card-title {
    font-size: 17px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .card-meta {
    margin-top: 3px;
    font-size: 12px;
    color: var(--text-2);
    font-variant-numeric: tabular-nums;
  }

  .field { margin-bottom: 20px; }
  .field-label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    color: var(--ink);
    margin-bottom: 8px;
  }

  :is(button, input, label):focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  /* ---- Icon buttons + custom tooltips ---- */
  .icon-row { display: flex; gap: 8px; }

  .icon-btn {
    position: relative;
    width: 34px;
    height: 34px;
    display: grid;
    place-items: center;
    background: var(--surface);
    color: var(--ink);
    border: 1px solid var(--hairline);
    border-radius: 12px;
    cursor: pointer;
    transition: background-color 150ms var(--ease-out), transform 140ms var(--ease-out);
  }
  .icon-btn:active { transform: scale(0.97); }
  .icon-btn svg { display: block; }

  .tip {
    position: absolute;
    bottom: calc(100% + 6px);
    left: 50%;
    background: var(--ink);
    color: var(--ground);
    font-size: 11px;
    font-weight: 500;
    line-height: 1;
    white-space: nowrap;
    padding: 6px 8px;
    border-radius: 7px;
    box-shadow: var(--shadow-tip);
    pointer-events: none;
    opacity: 0;
    transform: translateX(-50%) scale(0.97);
    transform-origin: bottom center;
    transition: opacity 140ms var(--ease-out), transform 140ms var(--ease-out);
  }
  .tip.open, .tip.pinned { opacity: 1; transform: translateX(-50%) scale(1); }
  .tip.no-anim { transition: none; }
  .icon-btn:focus-visible .tip { opacity: 1; transform: translateX(-50%) scale(1); }

  /* ---- Slider ---- */
  .slider { position: relative; --pct: 60; padding-top: 34px; }

  .slider .tip {
    bottom: auto;
    top: 0;
    left: calc(var(--pct) * 1% + (50 - var(--pct)) * 0.18px);
    font-variant-numeric: tabular-nums;
    transition: none; /* bubble tracks the thumb 1:1, never eased */
  }

  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 20px;
    background: transparent;
    cursor: grab;
    display: block;
  }
  input[type="range"]:active { cursor: grabbing; }

  input[type="range"]::-webkit-slider-runnable-track {
    height: 4px;
    border-radius: 999px;
    background: linear-gradient(to right,
      var(--ink) calc(var(--pct) * 1%),
      var(--tint-hover) calc(var(--pct) * 1%));
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 18px;
    height: 18px;
    margin-top: -7px;
    border-radius: 999px;
    background: var(--surface);
    border: 1px solid var(--hairline);
    box-shadow: var(--shadow-tip);
    transition: transform 140ms var(--ease-out);
  }
  input[type="range"]:active::-webkit-slider-thumb { transform: scale(0.97); }
  input[type="range"]:focus-visible { outline: none; }
  input[type="range"]:focus-visible::-webkit-slider-thumb {
    box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--accent);
  }

  input[type="range"]::-moz-range-track {
    height: 4px;
    border-radius: 999px;
    background: var(--tint-hover);
  }
  input[type="range"]::-moz-range-progress {
    height: 4px;
    border-radius: 999px;
    background: var(--ink);
  }
  input[type="range"]::-moz-range-thumb {
    width: 16px;
    height: 16px;
    border-radius: 999px;
    background: var(--surface);
    border: 1px solid var(--hairline);
    box-shadow: var(--shadow-tip);
  }
  input[type="range"]:focus-visible::-moz-range-thumb {
    box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--accent);
  }

  .slider-scale {
    display: flex;
    justify-content: space-between;
    margin-top: 6px;
    font-size: 11px;
    color: var(--text-3);
    font-variant-numeric: tabular-nums;
  }

  /* ---- Switch ---- */
  .switch-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    cursor: pointer;
  }
  .switch-row .field-label { margin-bottom: 0; cursor: pointer; }

  .switch {
    position: relative;
    width: 40px;
    height: 22px;
    flex: none;
  }
  .switch input {
    -webkit-appearance: none;
    appearance: none;
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border-radius: 999px;
    background: var(--tint-hover);
    border: 1px solid var(--hairline);
    cursor: pointer;
    transition: background-color 180ms var(--ease-out), border-color 180ms var(--ease-out);
  }
  .switch input:checked { background: var(--ink); border-color: var(--ink); }
  .switch::after {
    content: "";
    position: absolute;
    top: 3px;
    left: 3px;
    width: 16px;
    height: 16px;
    border-radius: 999px;
    background: var(--surface);
    box-shadow: var(--shadow-tip);
    pointer-events: none;
    transition: transform 180ms var(--ease-out);
  }
  .switch:has(input:checked)::after { transform: translateX(18px); }
  .switch:has(input:active)::after { transform: translateX(18px) scale(0.97); }

  /* ---- Segmented control ---- */
  .seg {
    position: relative;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    background: var(--tint);
    border-radius: 12px;
    padding: 3px;
  }
  .seg-thumb {
    position: absolute;
    top: 3px;
    left: 3px;
    width: calc((100% - 6px) / 3);
    height: calc(100% - 6px);
    background: var(--surface);
    border: 1px solid var(--hairline-soft);
    border-radius: 9px;
    box-shadow: var(--shadow-tip);
    transition: transform 180ms var(--ease-out);
  }
  .seg:has(.seg-opt:nth-of-type(2) input:checked) .seg-thumb { transform: translateX(100%); }
  .seg:has(.seg-opt:nth-of-type(3) input:checked) .seg-thumb { transform: translateX(200%); }

  .seg-opt {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 6px 0;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-2);
    cursor: pointer;
    border-radius: 9px;
    transition: color 150ms var(--ease-out);
  }
  .seg-opt:has(input:checked) { color: var(--ink); }
  .seg-opt input {
    position: absolute;
    width: 1px;
    height: 1px;
    opacity: 0;
    pointer-events: none;
  }
  .seg:has(input:focus-visible) {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .seg-opt:focus-visible { outline: none; }

  /* ---- Primary action ---- */
  .cta {
    width: 100%;
    margin-top: 2px;
    padding: 11px 20px;
    border: none;
    border-radius: 999px;
    background: var(--ink);
    color: var(--ground);
    font: inherit;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: background-color 150ms var(--ease-out), transform 140ms var(--ease-out);
  }
  .cta:active { transform: scale(0.97); }

  /* ---- Hover, gated to real pointers ---- */
  @media (hover: hover) and (pointer: fine) {
    .icon-btn:hover { background: var(--tint); z-index: 2; }
    .cta:hover { background: color-mix(in oklab, var(--ink) 88%, var(--ground)); }
    .seg-opt:hover:not(:has(input:checked)) { color: var(--ink); }
  }

  /* ---- Reduced motion: states remain, travel goes ---- */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; }
  }
</style>
</head>
<body>

<section class="card" aria-label="Brew timer">
  <header class="card-head">
    <div>
      <h1 class="card-title">Brew timer</h1>
      <p class="card-meta">V60 &middot; 18 g &middot; 300 ml</p>
    </div>
    <div class="icon-row">
      <button class="icon-btn" type="button" aria-label="Restart pour">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
          <path d="M3 3v5h5"/>
        </svg>
        <span class="tip" aria-hidden="true">Restart pour</span>
      </button>
      <button class="icon-btn" type="button" aria-label="Pause timer">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="9" y1="5" x2="9" y2="19"/>
          <line x1="15" y1="5" x2="15" y2="19"/>
        </svg>
        <!-- Force-visible for the static screenshot -->
        <span class="tip pinned" aria-hidden="true">Pause timer</span>
      </button>
      <button class="icon-btn" type="button" aria-label="Skip pour">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M5 5l9 7-9 7V5z"/>
          <line x1="19" y1="5" x2="19" y2="19"/>
        </svg>
        <span class="tip" aria-hidden="true">Skip pour</span>
      </button>
    </div>
  </header>

  <div class="field">
    <label class="field-label" for="temp">Water temperature</label>
    <div class="slider" id="temp-wrap">
      <span class="tip pinned" id="temp-bubble" aria-hidden="true">94&deg;C</span>
      <input type="range" id="temp" min="85" max="100" step="1" value="94"
             aria-label="Water temperature in degrees Celsius">
      <div class="slider-scale" aria-hidden="true"><span>85&deg;</span><span>100&deg;</span></div>
    </div>
  </div>

  <div class="field">
    <label class="switch-row">
      <span class="field-label">Bloom phase</span>
      <span class="switch"><input type="checkbox" checked aria-label="Bloom phase"></span>
    </label>
  </div>

  <div class="field">
    <span class="field-label" id="roast-label">Roast</span>
    <div class="seg" role="radiogroup" aria-labelledby="roast-label">
      <span class="seg-thumb" aria-hidden="true"></span>
      <label class="seg-opt"><input type="radio" name="roast" value="light">Light</label>
      <label class="seg-opt"><input type="radio" name="roast" value="medium" checked>Medium</label>
      <label class="seg-opt"><input type="radio" name="roast" value="dark">Dark</label>
    </div>
  </div>

  <button class="cta" type="button">Start brew</button>
</section>

<script>
  // Slider: live value bubble + ink fill, tracking the thumb 1:1.
  (function () {
    var range = document.getElementById("temp");
    var wrap = document.getElementById("temp-wrap");
    var bubble = document.getElementById("temp-bubble");
    function sync() {
      var pct = (range.value - range.min) / (range.max - range.min) * 100;
      wrap.style.setProperty("--pct", pct);
      bubble.textContent = range.value + "°C";
    }
    range.addEventListener("input", sync);
    sync();
  })();

  // Tooltips: 500ms hover delay; once one is open, adjacent ones open with
  // no delay and no animation; instant (no delay) on :focus-visible.
  (function () {
    var warm = false, warmTimer = null;
    document.querySelectorAll(".icon-btn").forEach(function (btn) {
      var tip = btn.querySelector(".tip");
      var openTimer = null;
      function open(instant) {
        clearTimeout(warmTimer);
        tip.classList.toggle("no-anim", instant);
        tip.classList.add("open");
        warm = true;
      }
      function close() {
        clearTimeout(openTimer);
        tip.classList.remove("open", "no-anim");
        clearTimeout(warmTimer);
        warmTimer = setTimeout(function () { warm = false; }, 300);
      }
      btn.addEventListener("mouseenter", function () {
        if (warm) open(true);
        else openTimer = setTimeout(function () { open(false); }, 500);
      });
      btn.addEventListener("mouseleave", close);
      btn.addEventListener("focus", function () {
        if (btn.matches(":focus-visible")) open(false);
      });
      btn.addEventListener("blur", close);
    });
  })();
</script>

</body>
</html>
